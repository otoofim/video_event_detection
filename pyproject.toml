[project]
name = "video_event_detection"
version = "0.1.0"
description = "Video event detection on LoL-V2T with caption-derived labels, low-latency serving and a temporal play-phase model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.16", "pandas>=2.2", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27", "jupyter-client", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools]
packages = ["common", "detection", "temporal", "serving", "benchmarks", "data", "data.scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # long docstrings and comments are fine; B008: FastAPI File() defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
