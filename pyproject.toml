[project]
name = "video_event_detection"
version = "0.1.0"
description = "Real-time eSports event detection, low-latency serving and temporal anomaly analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.16", "pandas>=2.2", "matplotlib>=3.8"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "onnxruntime>=1.17", "python-multipart>=0.0.9", "websockets>=12"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27", "jupyter-client", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools]
packages = ["common", "detection", "temporal", "serving", "benchmarks", "data", "data.scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
