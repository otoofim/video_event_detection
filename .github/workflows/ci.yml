name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[train,serve,extract,dev]"
          # scenedetect pulls opencv-python, whose cv2 shadows the contrib build TVL1 needs
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps opencv-contrib-python-headless
          python -c "import cv2; assert hasattr(cv2.optflow, 'DualTVL1OpticalFlow_create')"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
