# Temporal phase classifier on detector output. Trained on the val split's detector outputs
# (the detector never fits them), evaluated on the test split.
root: data/lolv2t
window: 6                    # seconds (bins) per window
stride: 2
bin_s: 1.0
hidden: 32
epochs: 40
batch_size: 64
lr: 0.001
holdout_frac: 0.2            # fraction of val clips held out for early stopping
seed: 0
max_clips: null
