# Unregularised reference: the original default U-Net settings, 40 epochs.
root: data/lolv2t
use_flow: true
arch: unet
model:
  vunet:
    hidden: 64
    latent: 32
    levels: 2
    dropout: 0.1
  unet:
    hidden: 64
    levels: 2
    dropout: 0.1
  dilated:
    hidden: 256
    dropout: 0.3
lam: 1.0
beta: 0.1
beta_warmup_epochs: 5
mc_samples: 16
epochs: 40
batch_size: 16
num_workers: 2
lr: 0.001
weight_decay: 0.0001
seed: 0
device: auto
norm_clips: 300
max_clips: null
label_span_s: 3.0
tolerance_s: 3.0
aggregator:
  min_run: 2
  min_conf: 0.5
bg_keep: 1.0            # full background (before the downsampling default)
