# Detector on LoL-V2T features with weak (caption-keyword) event labels.
root: data/lolv2t
use_flow: true               # concatenate optical-flow features to RGB features
arch: vunet                  # vunet (detector) | unet, dilated (ablations); --arch overrides
model:
  vunet: {hidden: 64, latent: 32, levels: 2, dropout: 0.1}
  unet: {hidden: 64, levels: 2, dropout: 0.1}
  dilated: {hidden: 256, dropout: 0.3}
lam: 1.0                     # weight of the reconstruction MSE (vunet only)
beta: 0.1                    # final weight of the KL term (vunet only)
beta_warmup_epochs: 5        # beta ramps linearly from 0 over these epochs
mc_samples: 16               # z samples for the uncertainty report (vunet only)
epochs: 15
batch_size: 16
num_workers: 2               # DataLoader workers (features load lazily from disk)
lr: 0.001
weight_decay: 0.0001
seed: 0
norm_clips: 300              # clips used for feature mean/std and class weights
max_clips: null              # cap per split for smoke runs (null = all available)
label_span_s: 3.0            # an event labels the next N seconds of steps
tolerance_s: 3.0             # event-level match window (commentary lags the action)
aggregator: {min_run: 2, min_conf: 0.5}
