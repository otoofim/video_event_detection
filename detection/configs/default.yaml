# Feature-based detector on LoL-V2T with weak (caption-keyword) event labels.
root: data/lolv2t
use_flow: true               # concatenate optical-flow features to RGB features
hidden: 256
dropout: 0.3
epochs: 15
batch_size: 16
lr: 0.001
weight_decay: 0.0001
seed: 0
device: auto               # auto = GPU when available, else cpu; or cpu / cuda
norm_clips: 300              # clips used for feature mean/std and class weights
max_clips: null              # cap per split for smoke runs (null = all available)
label_span_s: 3.0            # an event labels the next N seconds of steps
tolerance_s: 3.0             # event-level match window (commentary lags the action)
aggregator: {min_run: 2, min_conf: 0.5}
