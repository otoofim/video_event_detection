# Detection model config. Match indices refer to data/raw/match_XXXX.mp4.
input_size: [160, 96]        # (w, h) fed to the network
width: 16
train_matches: [0, 40]       # [start, end)
val_matches: [40, 50]
background_keep: 0.25        # fraction of background frames kept (events are always kept)
epochs: 8
batch_size: 128
lr: 0.002
weight_decay: 0.0001
seed: 0
tolerance_s: 0.5             # event-level match window
aggregator: {min_run: 2, min_conf: 0.5}
